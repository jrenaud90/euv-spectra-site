<form action='{{ url_for("main.homepage") }}' method='POST' id="name-form" onsubmit="return displayLoading('search');" style="width: 100%;">
    <fieldset>
        {{ name_form.csrf_token }}
        <div class="search_field">
            {{ name_form.star_name(class="input", placeholder="Star Name", id="name-form-input-group", autocomplete="off") }}
            <button type="submit" form="name-form" class="btn me-auto" id="name-form-submit" disabled>
                <i class="fas fa-search"></i>
            </button>
        </div>
    </fieldset>
</form>
